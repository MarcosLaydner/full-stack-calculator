services:
  backend:
    build:
      context: ./backend
    environment:
      PORT: '8081'
    expose:
      - '8081'
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:8081/health']
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      backend:
        condition: service_healthy
